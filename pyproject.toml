[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightsakt2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "pandas", "scikit-learn", "scipy", "matplotlib", "pytest"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
